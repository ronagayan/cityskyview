<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>shimushi.li</title>
  <!-- Libraries are served from this site (no CDN). -->
  <script src="vendor/aframe-v1.5.0.min.js"></script>
  <script src="vendor/mindar-image-aframe.prod.js"></script>
  <!-- Bump ?v= whenever config.js changes so phones do not keep an old cached copy. -->
  <script src="config.js?v=3"></script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    /* Plain camera feed: hide anything A-Frame or MindAR might add on top of it. */
    .a-enter-vr, .a-enter-ar, .a-orientation-modal, .a-loader-title, .mindar-ui-overlay { display: none !important; }
  </style>
</head>
<body>
  <script>
  (function () {
    var C = window.AR_CONFIG || {};
    var instagramUrl = C.instagramUrl || "https://www.instagram.com/";
    var popupScale = C.popupScale || 1;

    var scene = document.createElement("a-scene");
    scene.setAttribute("mindar-image",
      "imageTargetSrc: " + (C.targetsFile || "targets/targets.mind") + ";" +
      " filterMinCF: 0.0001; filterBeta: 0.001;" +           // smoother, less jittery tracking
      " uiLoading: no; uiScanning: no; uiError: no");        // no overlays: just the camera feed
    scene.setAttribute("color-space", "sRGB");
    scene.setAttribute("renderer", "colorManagement: true");
    scene.setAttribute("loading-screen", "enabled: false");
    scene.setAttribute("xr-mode-ui", "enabled: false");      // no VR/fullscreen button (A-Frame >= 1.5)
    scene.setAttribute("vr-mode-ui", "enabled: false");      // same, for older A-Frame builds
    scene.setAttribute("device-orientation-permission-ui", "enabled: false");
    scene.innerHTML =
      '<a-assets timeout="15000">' +
      '  <img id="popupImg" src="' + (C.popupImage || "assets/popup.png") + '">' +
      '</a-assets>' +
      // The cursor/raycaster on the camera turns taps on the pop-up into "click" events.
      '<a-camera position="0 0 0" look-controls="enabled: false"' +
      '  cursor="fuse: false; rayOrigin: mouse" raycaster="far: 10000; objects: .clickable"></a-camera>' +
      '<a-entity id="anchor" mindar-image-target="targetIndex: 0">' +
      '  <a-image id="popup" class="clickable" src="#popupImg" position="0 0 0.05"' +
      '    width="' + popupScale + '" height="' + popupScale + '" scale="0.001 0.001 0.001"' +
      '    animation__pop="property: scale; from: 0.001 0.001 0.001; to: 1 1 1; dur: 650; easing: easeOutElastic; startEvents: pop"' +
      '    animation__float="property: position; from: 0 0 0.05; to: 0 0.06 0.08; dur: 1600; dir: alternate; loop: true; easing: easeInOutSine">' +
      '  </a-image>' +
      '</a-entity>';
    document.body.appendChild(scene);

    var popup = document.getElementById("popup");
    var anchor = document.getElementById("anchor");
    var popupImg = document.getElementById("popupImg");

    // Keep the pop-up's aspect ratio equal to the image's.
    function fitPopup() {
      if (popupImg.naturalWidth && popupImg.naturalHeight) {
        popup.setAttribute("height", popupScale * popupImg.naturalHeight / popupImg.naturalWidth);
      }
    }
    if (popupImg.complete) fitPopup(); else popupImg.addEventListener("load", fitPopup);

    function openInstagram() {
      var w = window.open(instagramUrl, "_blank");
      if (w) { w.opener = null; } else { window.location.href = instagramUrl; }
    }

    var autoTimer = null;
    anchor.addEventListener("targetFound", function () {
      popup.emit("pop");                       // play the pop-up animation
      if (C.autoOpenDelayMs > 0 && !autoTimer) {
        autoTimer = setTimeout(function () { window.location.href = instagramUrl; }, C.autoOpenDelayMs);
      }
    });
    popup.addEventListener("click", openInstagram);

    scene.addEventListener("arError", function (e) { console.error("AR error", e.detail); });
  })();
  </script>
</body>
</html>
